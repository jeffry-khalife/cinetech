<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinetech</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles/tailwind.css" />
  <link rel="stylesheet" href="../styles/style.css" />
</head>

<body class="bg-gray-900 text-white">
  <div class="h-screen w-full bg-gray-700 relative flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="h-full w-16 flex flex-col space-y-10 items-center justify-center relative bg-gray-800 text-white">
      <div onclick="window.location.href='../pages/film.html'" class="h-10 w-10 flex items-center justify-center rounded-lg cursor-pointer hover:text-gray-800 hover:bg-white  hover:duration-300 hover:ease-linear focus:bg-white">
      <img src="../assets/images/film.png" alt="Film"></div>
  
      <div onclick="window.location.href='../pages/serie.html'" class="h-10 w-10 flex items-center justify-center rounded-lg cursor-pointer hover:text-gray-800 hover:bg-white  hover:duration-300 hover:ease-linear focus:bg-white">
        <img  src="../assets/images/serie.png" alt="Série"></div>
  
      <div onclick="window.location.href='../pages/favoris.html'" class="h-10 w-10 flex items-center justify-center rounded-lg cursor-pointer hover:text-gray-800 hover:bg-white  hover:duration-300 hover:ease-linear focus:bg-white">
        <img  src="../assets/images/favoris.png" alt="Favoris"></div>
  
      <div onclick= "window.location.href='../index.html'"  class="h-10 w-10 flex items-center justify-center rounded-lg cursor-pointer hover:text-gray-800 hover:bg-white  hover:duration-300 hover:ease-linear focus:bg-white">
        <img src="../assets/images/accueil.png" alt=""></div>
    </aside>
    <div class="w-full h-full flex flex-col justify-between">
      <header class="h-16 w-full flex items-center justify-end px-5 space-x-10 bg-gray-800">
        <div class="flex items-center space-x-4 text-white">
          <div class="text-md font-medium">Cinetech</div>
          <div class="h-10 w-10 rounded-full cursor-pointer bg-gray-200 border-2 border-blue-400">
            <img src="../assets/images/popcorn.png" alt="">
          </div>
        </div>
      </header>
      <div class="text-right">
        <input type="text" id="search-media" list="medias-list" placeholder="Recherchez un titre..." 
               class="w-1/2 p-3 border border-gray-600 rounded-lg bg-gray-700 text-white">
               <button id="search-button" class="text-sm text-white font-bold py-2 px-4 rounded mt-3 ml-2 mr-2 bg-grey-500 hover:bg-lime-400">Rechercher</button>
        <datalist id="medias-list"></datalist>
      </div>
      <h1 class="py-4 text-6xl font-extrabold bg-gradient-to-r from-blue-500 via-teal-500 to-pink-500 bg-clip-text text-transparent text-center">
        Films
      </h1>
      <main class="max-w-full h-full flex relative overflow-y-hidden">
        <div class="h-full w-full m-4 flex flex-col items-center justify-start gap-4 overflow-y-scroll">
          <div id="loading-spinner" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
            <div class="w-16 h-16 border-4 border-t-4 border-gray-500 border-solid rounded-full animate-spin"></div>
          </div>
          <div id="movie-container" class="p-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 w-full">
          </div>
          <div id="pagination" class="flex justify-center items-center space-x-2 mt-4 mb-6 flex-wrap"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/film.js"></script>
  <script src="../js/autocompletion.js"></script>
</body>
</html>

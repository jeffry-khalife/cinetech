<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Films Favoris</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-900 text-white">
  <div class="w-full h-full p-8">
    <div class="text-right">
      <input type="text" id="search-media" list="medias-list" placeholder="Recherchez un titre..." 
             class="w-1/2 p-3 border border-gray-600 rounded-lg bg-gray-700 text-white">
             <button id="search-button" class="text-sm text-white font-bold py-2 px-4 rounded mt-3 ml-2 mr-2 bg-grey-500 hover:bg-lime-400">Rechercher</button>
      <datalist id="medias-list"></datalist>
    </div><br>
    <h1 class="text-4xl text-center mb-8">Favoris</h1>

    <div id="favorites-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    </div>

    <div class="mt-8">
      <a href="../pages/film.html" class="bg-gray-700 px-4 py-2 rounded-lg text-white inline-block">Retour</a>
    </div>
  </div>

  <script src="../js/favoris.js"></script>
  <script src="../js/autocompletion.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinetech</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/tailwind.css">
    <link rel="stylesheet" href="style.css"> 
</head>

  
<body class="bg-gray-900 text-white">

    <div class="h-screen w-full bg-gray-700 relative flex overflow-hidden">

     <!-- Sidebar -->
     <aside class="h-full w-16 flex flex-col space-y-10 items-center justify-center relative bg-gray-800 text-white">
      <!-- Profile -->
      <div onclick="window.location.href='../film/index.html'" class="h-10 w-10 flex items-center justify-center rounded-lg cursor-pointer hover:text-gray-800 hover:bg-white  hover:duration-300 hover:ease-linear focus:bg-white">
      <img src="assets/images/film.png" alt="Film"></div>
  
      <!-- Courses -->
      <div onclick="window.location.href='../serie/index.html'" class="h-10 w-10 flex items-center justify-center rounded-lg cursor-pointer hover:text-gray-800 hover:bg-white  hover:duration-300 hover:ease-linear focus:bg-white">
        <img  src="assets/images/serie.png" alt="Série"></div>
  
      <!-- Theme -->
      <div onclick="window.location.href='../favori/favori.html'" class="h-10 w-10 flex items-center justify-center rounded-lg cursor-pointer hover:text-gray-800 hover:bg-white  hover:duration-300 hover:ease-linear focus:bg-white">
        <img  src="assets/images/favoris.png" alt="Favoris"></div>
  
      <!-- Configuration -->
      <div onclick= "window.location.href='../accueil/accueil.html'"  class="h-10 w-10 flex items-center justify-center rounded-lg cursor-pointer hover:text-gray-800 hover:bg-white  hover:duration-300 hover:ease-linear focus:bg-white">
        <img src="assets/images/accueil.png" alt=""></div>
    </aside>
      
        
       
        <div class="w-full h-full flex flex-col justify-between">
          <header class="h-16 w-full flex items-center relative justify-end px-5 space-x-10 bg-gray-800">
            <div class="flex flex-shrink-0 items-center space-x-4 text-white">
                <div class="flex flex-col items-end ">
                <div class="text-md font-medium ">Cinetech</div>
              </div>
              
              <div class="h-10 w-10 rounded-full cursor-pointer bg-gray-200 border-2 border-blue-400"><img src="assets/images/popcorn.png" alt=""></div>
            </div>
          </header>
      
          <!-- Main -->
          <main class="max-w-full h-full flex relative overflow-y-hidden">
            <!-- Container -->
            <div class="h-full w-full m-4 flex flex-wrap items-start justify-start rounded-tl grid-flow-col auto-cols-max gap-4 overflow-y-scroll">
              <!-- Container -->
        
            <div id="movie-container" class="p-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            </div>
            </div>
          </main>
        </div>
      
      </div>

    <script src="app.js"></script>
</body>
</html>

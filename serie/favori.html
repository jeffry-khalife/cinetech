<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>titres Favoris</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-700 m-5 grid gap-10 lg:m-0 lg:my-12 lg:mx-20 lg:items-center">

    <nav class="bg-gray-900 shadow-md p-4 flex justify-between items-center">
        <a href="../index.html" class="text-3xl font-bold text-white">Favoris</a>
    </nav>

    <body class="bg-gray-900 text-white">

        <div class="h-screen w-full bg-gray-700 relative flex overflow-hidden">
    
            <!-- Sidebar -->
            <aside class="h-full w-16 flex flex-col space-y-10 items-center justify-center relative bg-gray-800 text-white">
              <!-- Profile -->
              <div class="h-10 w-10 flex items-center justify-center rounded-lg cursor-pointer hover:text-gray-800 hover:bg-white  hover:duration-300 hover:ease-linear focus:bg-white">
              <img src="assets/images/film.png" alt=""></div>
          
              <!-- Courses -->
              <div class="h-10 w-10 flex items-center justify-center rounded-lg cursor-pointer hover:text-gray-800 hover:bg-white  hover:duration-300 hover:ease-linear focus:bg-white">
                <img src="assets/images/serie.png" alt=""></div>
          
              <!-- Theme -->
              <div class="h-10 w-10 flex items-center justify-center rounded-lg cursor-pointer hover:text-gray-800 hover:bg-white  hover:duration-300 hover:ease-linear focus:bg-white">
                <img src="assets/images/favoris.png" alt=""></div>
          
              <!-- Configuration -->
              <div class="h-10 w-10 flex items-center justify-center rounded-lg cursor-pointer hover:text-gray-800 hover:bg-white  hover:duration-300 hover:ease-linear focus:bg-white">
                <img src="assets/images/recherche.png" alt=""></div>
            </aside>

    <section class="text-right">
        <input id="search-titre" list="titres-list" placeholder="Rechercher un titre..." class="w-80 p-2 mb-4 mt-3 border border-green-50"/>
        <datalist id="titres-list"></datalist>
        <button id="search-button" class="text-sm text-white font-bold py-2 px-4 rounded mt-3 ml-2 mr-2 bg-gray-900 hover:bg-red-400">Rechercher un titre</button>
    </section>

<!--FAVORIS-->
    <div id="favoris-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    
    <div id="modelConfirm" class="fixed hidden z-50 inset-0 bg-gray-900 bg-opacity-60 overflow-y-auto h-full w-full px-4">
        <div class="relative top-10 mx-auto shadow-xl rounded-md bg-white max-w-md">
            <div class="flex justify-end p-2">
                <button onclick="closeModal('modelConfirm')" type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>

            <div class="p-6 pt-0 text-center">
                <img id="popup-image" class="w-full h-40 object-cover rounded-lg mb-4" alt="titre Image">
                <h3 id="popup-title" class="text-xl font-normal text-gray-500 mt-5 mb-6"></h3>
                <p id="popup-category" class="text-sm text-gray-600 mb-4"></p>
                <p id="popup-time" class="text-sm text-gray-600 mb-4"></p>

                <h3 class="text-lg font-semibold mb-2">Ingrédients:</h3>
                <ul id="popup-ingredients" class="list-disc pl-5 mb-4"></ul>

                <div class="mt-4">
                    <button id="add-to-shopping-list" class="bg-green-500 hover:bg-lime-400 text-white rounded-full px-4 py-2 hover:bg-lime-400 transition mt-2">Ajouter à la liste de courses</button>
                </div><br>

                <ol id="popup-steps" class="list-decimal pl-5"></ol>
            </div>
            </div>
        </div>
    </div>

    <script src="../serie/serie.js"></script>
    <script scr="../serie/autocompletion.js"></script>
</body>
</html>
